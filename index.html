<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ShramPass: one ledger that protects India's delivery riders across every app and state.">
<title>ShramPass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B3C49">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}

/* Layout: a phone-first rider app (header, one scrolling screen, thumb-reach bottom nav). On wide screens the app sits in a device frame and the partner view opens beside it. */
:root{
  --bg:#F2F7F8; --surface:#FFFFFF; --sunk:#E3F1F3; --line:#CBE1E5;
  --ink:#0B2A31; --muted:#4A6A70;
  --t900:#0B3C49; --t700:#135E6C; --t500:#2A8696; --t300:#8CC3CC; --t100:#E3F1F3;
  --on-dark:#FFFFFF; --card-a:#0B3C49; --card-b:#135E6C; --shade:rgba(6,25,30,.45);
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Hanken Grotesk","Noto Sans Devanagari","Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06191E; --surface:#0C262D; --sunk:#113540; --line:#1D4652; --ink:#E3F1F3; --muted:#93B6BD;
  --t900:#8CC3CC; --t700:#6BB0BC; --t500:#4FA3B2; --t300:#2A8696; --t100:#113540;
  --on-dark:#06191E; --card-a:#135E6C; --card-b:#2A8696; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06191E; --surface:#0C262D; --sunk:#113540; --line:#1D4652; --ink:#E3F1F3; --muted:#93B6BD;
  --t900:#8CC3CC; --t700:#6BB0BC; --t500:#4FA3B2; --t300:#2A8696; --t100:#113540;
  --on-dark:#06191E; --card-a:#135E6C; --card-b:#2A8696; --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-stretch:85%;line-height:1.15;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--t500);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em;letter-spacing:.02em}

.shell{height:100%;display:flex;justify-content:center;gap:24px}
#app{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
#app>header{background:var(--t900);color:#fff;padding:10px var(--gut-r) 10px var(--gut-l);display:flex;align-items:center;gap:8px}
:root[data-theme="dark"] #app>header{color:var(--on-dark)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #app>header{color:var(--on-dark)}}
.logo{font-family:var(--display);font-weight:800;font-size:22px;font-stretch:85%;margin-right:auto;display:flex;align-items:center;gap:7px}
.logo svg{width:22px;height:22px}
.hbtn{border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:99px;padding:5px 11px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px;min-height:34px}
.hbtn svg{width:16px;height:16px}
#screen{flex:1;overflow-y:auto;padding:14px var(--gut-r) 18px var(--gut-l);display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
#screen>*{flex:none}
nav.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:0 var(--gut-r) 0 var(--gut-l)}
nav.tabbar button{border:0;background:none;padding:9px 0 10px;font-size:12.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;position:relative}
nav.tabbar button svg{width:23px;height:23px}
nav.tabbar button[aria-current="page"]{color:var(--t700)}
nav.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--t500)}
.dot{position:absolute;top:7px;right:calc(50% - 18px);min-width:17px;height:17px;border-radius:9px;background:var(--t500);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card>h3,.sec{font-size:17px;color:var(--t900);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec a,.link{font-family:var(--body);font-stretch:100%;font-size:14px;font-weight:700;color:var(--t700);background:none;border:0;padding:0;text-decoration:none}
.k{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}

.banner{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;background:var(--t700);color:#fff;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.4}
:root[data-theme="dark"] .banner{color:var(--on-dark)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner{color:var(--on-dark)}}
.banner .ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.banner .ic svg{width:24px;height:24px}
.banner b{display:block;font-size:16px}

.pass{background:linear-gradient(135deg,var(--card-a),var(--card-b));color:#fff;border-radius:18px;padding:16px;position:relative;overflow:hidden}
.pass::after{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;border:26px solid rgba(255,255,255,.06)}
.pass .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1}
.pass .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.pass .nm{font-family:var(--display);font-size:24px;font-weight:700;font-stretch:85%}
.pass .uan{font-family:var(--mono);font-size:13.5px;opacity:.95}
.medal{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.17);border-radius:99px;padding:4px 12px 4px 5px;font-weight:700;font-size:14.5px;white-space:nowrap}
.medal i{width:20px;height:20px;border-radius:50%;background:var(--medal);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.pass .prog{margin-top:14px;position:relative;z-index:1}
.pass .bar{background:rgba(255,255,255,.2)}
.pass .bar i{background:#fff}
.pass .ticks{color:rgba(255,255,255,.8)}
.pass .big{font-family:var(--display);font-stretch:80%;font-size:28px;font-weight:800;line-height:1;white-space:nowrap}
.pass .acts{display:flex;gap:8px;margin-top:12px;position:relative;z-index:1}
.pass .acts button{flex:1;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:9px 6px;font-weight:700;font-size:14px;display:flex;justify-content:center;align-items:center;gap:6px}
.pass .acts svg{width:18px;height:18px}
.bar{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--t700),var(--t500));border-radius:99px;transition:width .6s ease}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0}
.tile b{display:block;font-family:var(--display);font-stretch:80%;font-size:23px;color:var(--t700);line-height:1.15;white-space:nowrap}
.tile small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.tile .delta{font-size:12.5px;font-weight:700;color:var(--t700)}

.spark{display:block;width:100%;height:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--t100);color:var(--t700);border:1px solid var(--line)}
.chip.solid{background:var(--t700);color:var(--on-dark);border-color:var(--t700)}
.chip.off{background:transparent;color:var(--muted)}
.chip svg{width:14px;height:14px}

.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo button{width:100%;display:grid;grid-template-columns:28px 1fr 18px;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px;min-height:52px}
.todo .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--t500);display:grid;place-items:center;color:var(--on-dark)}
.todo .done .box{background:var(--t500)}
.todo .done span{color:var(--muted);text-decoration:line-through}
.todo svg{width:16px;height:16px}

.help{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.help button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13.5px;line-height:1.25;text-align:center;min-height:92px}
.help button svg{width:28px;height:28px;color:var(--t700)}
.help button:active{background:var(--t100)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.li{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;font-size:15px;line-height:1.35}
.li .ic{width:36px;height:36px;border-radius:10px;background:var(--t100);color:var(--t700);display:grid;place-items:center}
.li .ic svg{width:19px;height:19px}
.li small{display:block;color:var(--muted);font-size:13px}
.amt{font-weight:700;color:var(--t700);white-space:nowrap}

.track{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.track span{font-size:11.5px;color:var(--muted);border-top:4px solid var(--line);padding-top:4px;font-weight:600}
.track span.on{border-color:var(--t500);color:var(--t700)}
.req{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.req b{font-size:15px}

.hb{display:grid;grid-template-columns:96px 1fr 76px;gap:8px;align-items:center;font-size:14px}
.hb .bar{height:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}

.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px 0;font-weight:700;font-size:14.5px;min-height:46px}
.seg button[aria-pressed="true"]{background:var(--t700);color:var(--on-dark)}
.tier{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.tier.on{border-color:var(--t500);box-shadow:inset 5px 0 0 var(--t500)}
.tier.locked{opacity:.66}
.tier ul{margin:8px 0 0;padding-left:20px;font-size:15px}
.tl{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--t300);display:flex;flex-direction:column;gap:10px;font-size:15px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-22px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--t500);border:2px solid var(--surface)}
.tl b{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em}

.field{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-weight:400;font-size:16px;min-height:46px}
.field textarea{resize:vertical;min-height:84px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:15px}
.checks label{display:flex;gap:7px;align-items:center;min-height:36px}
.checks input{width:20px;height:20px;accent-color:var(--t700)}
.btn{border:0;background:var(--t700);color:var(--on-dark);border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px;min-height:48px;display:inline-flex;justify-content:center;align-items:center;gap:8px}
.btn.wide{width:100%}
.btn.alt{background:var(--surface);color:var(--t700);border:1.5px solid var(--t500)}
.btn svg{width:19px;height:19px}
.err{color:var(--t700);font-weight:700;font-size:14px;border-left:3px solid var(--t500);padding-left:8px;margin:8px 0 0}
.cert{margin-top:10px;border:1.5px dashed var(--t500);border-radius:12px;padding:12px;font-size:15px;background:var(--t100)}

/* community */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-weight:700;font-size:14px;min-height:38px}
.filters button[aria-pressed="true"]{background:var(--t900);color:var(--on-dark);border-color:var(--t900)}
.post{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.post.ex{border-style:dashed;background:transparent}
.post .who{display:flex;align-items:center;gap:9px;font-size:14px}
.av{width:34px;height:34px;border-radius:50%;background:var(--t100);color:var(--t700);display:grid;place-items:center;font-weight:800;font-family:var(--display);flex:none}
.post .who b{display:block;font-size:14.5px}
.post .who small{color:var(--muted);font-size:12.5px}
.post p{margin:0;font-size:15.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.pacts{display:flex;gap:6px;flex-wrap:wrap}
.pacts button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:700;display:flex;gap:5px;align-items:center;min-height:36px}
.pacts button svg{width:16px;height:16px}
.pacts button[aria-pressed="true"]{background:var(--t100);border-color:var(--t500);color:var(--t700)}
.replies{border-left:3px solid var(--t300);padding-left:10px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.replies .r b{font-size:13px;color:var(--t700)}
.compose{display:flex;flex-direction:column;gap:10px}
.count{font-size:12.5px;color:var(--muted);text-align:right}

/* sheet */
.sheet-wrap{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px var(--gut-r) calc(18px + env(safe-area-inset-bottom,0px)) var(--gut-l);display:flex;flex-direction:column;gap:12px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 2px}
.sheet h2{font-size:22px;color:var(--t900)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:15.5px;line-height:1.4;counter-increment:s}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--t100);color:var(--t700);font-weight:800;display:grid;place-items:center}
.bigqr{background:#fff;border-radius:16px;padding:14px;width:min(260px,100%);margin:0 auto}
.bigqr svg{display:block;width:100%;height:auto}
.demo-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.demo-acts button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left;display:flex;gap:9px;align-items:center;font-weight:700;font-size:14px;min-height:52px}
.demo-acts svg{width:22px;height:22px;color:var(--t700);flex:none}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:grid;grid-template-columns:74px 1fr;gap:8px;font-size:13.5px;padding:7px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.log .w{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--t700);padding-top:2px}

/* partner view */
#partner{display:none;flex:1;max-width:820px;height:100%;overflow-y:auto;padding:16px var(--gut-r) 28px var(--gut-l)}
body.p-open #partner{display:block}
body.p-open #app{display:none}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.phead h1{font-size:26px;color:var(--t900);margin-right:auto}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.ptabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14.5px}
.ptabs button[aria-selected="true"]{background:var(--t900);color:var(--on-dark);border-color:var(--t900)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.panel>h2{font-size:21px;color:var(--t900)}
.panel>p.sub{margin:4px 0 12px;color:var(--muted);font-size:15px;max-width:70ch}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi b{display:block;font-family:var(--display);font-stretch:80%;font-size:25px;color:var(--t700);line-height:1.15}
.kpi small{color:var(--muted);font-size:13px;display:block;line-height:1.35}
.chain{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.chain div{border-radius:10px;padding:9px 10px;font-size:13.5px;line-height:1.35;background:var(--t100);border:1px solid var(--line)}
.chain div b{display:block;color:var(--t900);font-size:14px;margin-bottom:3px}
.chain div:nth-child(4),.chain div:nth-child(5){background:var(--t700);color:var(--on-dark);border-color:var(--t700)}
.chain div:nth-child(4) b,.chain div:nth-child(5) b{color:var(--on-dark)}
.stack{height:28px;display:flex;border-radius:8px;overflow:hidden;margin:6px 0}
.stack div{display:grid;place-items:center;font-size:12.5px;font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.phase{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.phase:last-child{border-bottom:0}
.phase .when{font-family:var(--display);font-stretch:85%;font-weight:800;color:var(--t700);font-size:17px;line-height:1.2}
.phase h3{font-size:17px;color:var(--t900);margin-bottom:4px}
.phase p{margin:0;font-size:14.5px}
.gate{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--t700);background:var(--t100);border-radius:8px;padding:3px 8px}
input[type=range]{width:100%;accent-color:var(--t700);min-height:32px}
.bigno{font-family:var(--display);font-stretch:80%;font-size:44px;font-weight:800;color:var(--t900);line-height:1}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pills button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-weight:700;font-size:14px}
.pills button[aria-pressed="true"]{background:var(--t900);color:var(--on-dark);border-color:var(--t900)}

}

function qr(txt){let h=0;for(const c of txt)h=(h*31+c.charCodeAt(0))>>>0;const n=25;let s='';
  const fin=(x,y)=>x<7&&y<7||x>=n-7&&y<7||x<7&&y>=n-7;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){let on;
    if(fin(x,y)){const fx=x>=n-7?x-(n-7):x,fy=y>=n-7?y-(n-7):y;on=fx===0||fy===0||fx===6||fy===6||(fx>=2&&fx<=4&&fy>=2&&fy<=4)}
    else if(x===7||y===7||x===n-8||y===n-8)on=false;
    else{h=(h*1103515245+12345)>>>0;on=(h>>16)&1}
    if(on)s+='<rect x="'+x+'" y="'+y+'" width="1.02" height="1.02"/>'}
  return '<svg viewBox="-1 -1 27 27" role="img" aria-label="ShramPass QR code"><rect x="-1" y="-1" width="27" height="27" fill="#fff"/><g fill="#0B3C49">'+s+'</g></svg>'}

  if(r.save){const s=Math.round(wk*r.save/100);r.saved+=s;if(tierI(r)===2&&r.matched<1200){const m=Math.min(s,1200-r.matched);r.matched+=m}}
  r.reqs.forEach(q=>{if(q.st<3)q.st++});r.alert=null;
  if(!quiet){log('Platform',`3 apps uploaded week ${S.week}: ${rs(wk)} for UAN ...${r.uan.slice(-4)}; platforms pay ${rs(wk*.0203)}`);log('Ledger',`12-month credits ${rs(total(r))}: ${tierOf(r).id}`)}

  const r=R(),ti=tierI(r),next=TIERS[ti+1];const msg=t('say_main',{n:r.first,t:tn(TIERS[ti].id),e:rs(total(r)),w:rs(wkSum(r.weeks[r.weeks.length-1])),p:rs(paidYear(r)),next:next?t('say_next',{a:rs(next.min-total(r)),t:tn(next.id)}):t('say_top')}).replace(/Rs /g,lang==='hi'?'रुपये ':'rupees ');
  const u=new SpeechSynthesisUtterance(msg);u.lang=lang==='hi'?'hi-IN':'en-IN';u.rate=.95;u.onend=()=>{speaking=false;render()};ss.cancel();ss.speak(u);speaking=true;render()}catch(e){toast(lang==='hi'?'इस फ़ोन पर आवाज़ उपलब्ध नहीं':'Read aloud is not available on this device')}};
let tt;function toast(m){const x=$('#toast');x.textContent=m;x.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>x.classList.remove('show'),2300)}

/* ---------------- partner view ---------------- */
const PT=[['why','Why'],['platform','Platforms'],['board','Board ledger'],['cost','Cost model'],['road','Roadmap']];
const SC={low:{n:'Low cost',per:628,pct:1.37,ord:.68},base:{n:'Base',per:933,pct:2.03,ord:1.02},high:{n:'High cost',per:1317,pct:2.87,ord:1.43}};
const MIX=[['Heat and rain pause pay',25.2],['Life cover',19.6],['Accident income',12.6],['Pension match',8.6],['Base accident cover',8.0],['Accident cover top-up',2.3],['Maternity top-up',0.1]];
const kpi=(b,s)=>`<div class="kpi"><b class="num">${b}</b><small>${s}</small></div>`;
const hb=(n,v,mx,lab)=>`<div class="hb" style="grid-template-columns:minmax(110px,180px) 1fr 70px"><span>${n}</span><div class="bar"><i style="width:${Math.max(1,v/mx*100)}%"></i></div><span class="num" style="text-align:right">${lab}</span></div>`;
function pWhy(){return `
 <section class="panel"><h2>The problem</h2><p class="sub">Social security law now covers platform workers, but the way eligibility is counted leaves most delivery riders out.</p>
  <div class="g3">${kpi('38 days','an average delivery rider\'s working year on one app, against a 90-day bar')}${kpi('9.5%','of Karnataka\'s platform workers registered (37,871 of about 4 lakh)')}${kpi('56%','of workers distrust platform safety reporting')}${kpi('62%','have no health insurance')}${kpi('27%','have had an accident at work')}${kpi('9.2','deliveries lost in a heatwave week without cash support')}</div></section>
 <section class="panel"><h2>Why it happens</h2><div class="g2">${[
  ['Eligibility counts days per app','Riders split work across apps, so few reach 90 days on one or 120 across all.'],
  ['Riders are not on the register','Sign-up happens on a separate portal that riders rarely visit.'],
  ['Records go stale','Old bank or district details quietly cut riders out of payments.'],
  ['Riders will not prepay','Income is volatile, so voluntary premiums lapse.'],
  ['Two levies, one payout','State welfare fees and the central levy overlap, so platforms push back.'],
  ['Claims need paperwork','Forms and follow-ups mean cash arrives late or not at all.']].map(([a,b])=>`<div class="kpi"><b style="font-size:18px">${a}</b><small>${b}</small></div>`).join('')}</div></section>
 <section class="panel"><h2>Who is involved</h2><div class="tbl"><table><thead><tr><th>Stakeholder</th><th>Needs</th><th>Constrained by</th><th>Role in ShramPass</th></tr></thead><tbody>${[
  ['Riders','Fast cash; cover that travels','Volatile income; will not prepay','Use the app; no forms, no deductions'],
  ['Platforms','One compliance regime','Thin margins; double levy in court','e-KYC at sign-up; weekly payout upload; pay 2.03%'],
  ['Centre and Board','A working Section 114 scheme','Limited fiscal room','Run the ledger, set tiers, publish the app'],
  ['States','Visible welfare in their cities','Uneven capacity','Fee credited; help desks resolve requests'],
  ['Insurers','Large pool, clean data','Past losses on cheap cover','Group cover priced on real claims'],
  ['Consumers','Same price, same speed','Fee already Rs 17.58 an order','No extra charge']].map(r=>'<tr>'+r.map((c,i)=>i?`<td>${c}</td>`:`<td><b>${c}</b></td>`).join('')+'</tr>').join('')}</tbody></table></div></section>
 <section class="panel"><h2>Theory of change</h2><p class="sub">Every feature in the rider app sits on one data field: weekly payouts per UAN.</p>
  <div class="chain"><div><b>Inputs</b>Payout data; Section 114 levy; funded schemes</div><div><b>Activities</b>UAN credits; e-KYC at sign-up; cash released by public records</div><div><b>Outputs</b>Every active rider covered from the first payout</div><div><b>Outcomes</b>More riders eligible; cash in days; safer in heat</div><div><b>Impact</b>Fewer households in debt; savings for old age</div></div>
  <p class="sub" style="margin-top:12px">Evidence: in a Delhi trial, riders given Rs 200 with a heat warning lost 3.6 deliveries in a heatwave week instead of 9.2.</p></section>
 <section class="panel"><h2>Impact at national scale</h2><p class="sub">At 50 lakh delivery riders, base case.</p>
  <div class="g2">${kpi('50 lakh','riders covered from the first payout; the day-count test reaches about 9 lakh')}${kpi('22.5 lakh','riders get life cover, accident income and pause pay (Silver or Gold)')}${kpi('Rs 382 cr','a year reaches riders as cash and cover: 82% of every rupee raised')}${kpi('9.2 to 3.6','deliveries lost in a heatwave week once Rs 200 pause pay arrives')}</div>
  <p class="sub" style="margin-top:10px">Why only 9 lakh today: at Rs 714 a day, a rider earning Rs 45,000 a year works about 63 days, so only full-time riders (about 18%) pass a 90 or 120-day test.</p></section>
 <section class="panel"><h2>What riders get in this app</h2><div class="g2">${[
  ['One-page dashboard','Tier, weekly earnings, cover, money received, savings, to-dos and requests on the Home screen.'],
  ['Earnings across apps','Every app adds to one 12-month total, so multi-app riders qualify.'],
  ['Cash without forms','Heat, rain, accident and death records trigger DBT payments.'],
  ['One-tap help','Accident, blocked ID or payment problem, routed to the state help desk with tracking.'],
  ['Portable record','A QR card any app can scan, a work passport and consent-based certificates.'],
  ['Voice and language','Hindi toggle and read-aloud for riders who prefer listening.'],
  ['Savings switch','Voluntary 1% or 2% into APY or NPS, matched at Gold.'],
  ['Rider community','Tips and problems by topic; the board reviews top issues weekly.']].map(([a,b])=>`<div class="kpi"><b style="font-size:17px">${a}</b><small>${b}</small></div>`).join('')}</div></section>`}
const NAMES=['Ramesh Kumar','Lakshmi N','Imran Pasha','Suresh Gowda','Divya R','Mohan Lal','Anil Shetty','Kavya M'];
let PS={plat:'tg',onb:null,newR:[]};
function platRows(p){let x=p.charCodeAt(0)*97+S.week;const g=()=>{x=(x*16807)%2147483647;return x/2147483647};
  const rows=NAMES.map((n,i)=>({n,uan:'...'+String(3310+i*1173).slice(-4),dist:i%3===2?'Ahmedabad':'Bengaluru Urban',amt:Math.round((300+g()*1100)/10)*10}));
  PS.newR.filter(r=>r.plat===p).forEach(r=>rows.push({n:r.name,uan:'...'+r.uan.slice(-4),dist:r.dist,amt:0,isNew:true}));return rows}
function pPlatform(){const p=PS.plat,app=APPS.find(a=>a.id===p),rows=platRows(p),tot=rows.reduce((a,b)=>a+b.amt,0);
  const scale=42000,pay=tot*scale/1e7,due=pay*.0203,ka=rows.filter(r=>r.dist!=='Ahmedabad').reduce((a,b)=>a+b.amt,0)*scale/1e7,credit=app.st?ka*.01:0;
  return `<section class="panel"><h2>Onboard a new rider: no UAN, no activation</h2><p class="sub">The platform runs Aadhaar e-KYC inside its own sign-up and links the e-Shram UAN. Bronze cover is live from the first payout. Riders never visit a separate portal.</p>
   <form id="onb" class="g2" novalidate>
    <label class="field">Rider name<input id="onb-name" value="Farida Shaikh" autocomplete="off"></label>
    <label class="field">Mobile number<input id="onb-mob" value="98250 41736" inputmode="numeric" autocomplete="off"></label>
    <label class="field">Work district<select id="onb-dist"><option>Ahmedabad</option><option>Bengaluru Urban</option></select></label>
    <label class="field">Platform<select id="onb-plat">${APPS.map(a=>`<option value="${a.id}" ${a.id===p?'selected':''}>${a.name}</option>`).join('')}</select></label>
    <label class="checks" style="grid-column:1/-1"><input type="checkbox" id="onb-consent" checked> Rider agrees to share weekly payout totals and district with the ShramPass ledger</label>
    <div style="grid-column:1/-1"><button class="btn" type="submit">Run e-KYC and link UAN</button></div></form>
   <ol class="steps" id="onb-steps" style="margin-top:12px">${PS.onb?PS.onb.map(x=>`<li>${x}</li>`).join(''):''}</ol><div id="onb-err"></div></section>
  <section class="panel"><h2>Weekly payout upload</h2><p class="sub">One field per rider: the week's payout total against UAN and district. No routes, orders or customer data leave the platform.</p>
   <div class="pills">${APPS.map(a=>`<button data-plat="${a.id}" aria-pressed="${a.id===p}">${a.name} · ${a.kind}</button>`).join('')}</div>
   <div class="tbl"><table><thead><tr><th>Rider</th><th>UAN</th><th>District</th><th class="r">Week ${S.week} payout</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.n)}${r.isNew?' <span class="chip">new</span>':''}</td><td class="mono">${r.uan}</td><td>${esc(r.dist)}</td><td class="r num">${r.amt?rs(r.amt):'From next week'}</td></tr>`).join('')}<tr><td colspan="3"><b>Sample of ${rows.length} riders</b></td><td class="r num"><b>${rs(tot)}</b></td></tr></tbody></table></div></section>
  <section class="panel"><h2>This week's contribution</h2><p class="sub">The platform pays 2.03% of payouts. A state welfare fee already paid on the same payouts is credited against the central amount, so platforms pay once.</p>
   <div class="g3">${kpi('Rs '+due.toFixed(2)+' cr',app.name+' at 2.03% of Rs '+pay.toFixed(1)+' cr weekly payouts, whole fleet')}${kpi('Rs '+credit.toFixed(2)+' cr',app.st?'Karnataka 1% welfare fee on food and grocery payouts, credited':'No state fee on parcel payouts, so no credit')}${kpi('Rs '+(due-credit).toFixed(2)+' cr','net due to the central fund; upload within 45 days or pay 1% a month interest')}</div></section>
  <section class="panel"><h2>Can the largest platforms afford it?</h2><div class="g3">${kpi('Re 1.02','per order, about 5.8% of the Rs 17.58 platform fee')}${kpi('Rs 122 cr','needed by the largest food platform a year, against a Rs 231 cr legal floor')}${kpi('Rs 79 cr','needed by a large quick-commerce platform a year')}</div></section>`}
function wirePlatform(){const f=$('#onb');if(!f)return;
  f.onsubmit=e=>{e.preventDefault();const err=m=>{$('#onb-err').innerHTML=`<p class="err">${m}</p>`};$('#onb-err').innerHTML='';
    const name=$('#onb-name').value.trim(),mob=$('#onb-mob').value.replace(/\D/g,'');
    if(!name)return err('Enter the rider\'s name as it appears on Aadhaar.');
    if(mob.length!==10)return err('Enter a 10-digit mobile number linked to Aadhaar.');
    if(!$('#onb-consent').checked){PS.onb=null;$('#onb-steps').innerHTML='';return err('The rider must agree to share weekly payout totals. Without it the account cannot be activated.')}
    const plat=$('#onb-plat').value,app=APPS.find(a=>a.id===plat),uan=String(4022+PS.newR.length)+' '+mob.slice(0,4)+' '+mob.slice(-4);
    PS.newR.push({name,uan,dist:$('#onb-dist').value,plat});PS.plat=plat;
    PS.onb=['Aadhaar e-KYC by OTP inside '+app.name+' sign-up: passed','e-Shram UAN '+uan+' linked in real time','ShramPass Bronze active: accident cover from the first payout','Rider can now take orders'];
    log('Platform',`${app.name} onboarded ${name}: e-KYC passed, UAN ...${uan.slice(-4)} linked, Bronze live`);
    const y=$('#partner').scrollTop;renderPartner();$('#partner').scrollTop=y}}
function pBoard(){const riders=300000,cnt={};Comm.posts.forEach(p=>cnt[p.topic]=(cnt[p.topic]||0)+1);const mx=Math.max(1,...Object.values(cnt));
  const split=[['Bronze',55,'#8CC3CC','#0B3C49'],['Silver',27,'#2A8696','#fff'],['Gold',18,'#0B3C49','#fff']];
  return `<section class="panel"><h2>Pilot ledger, Bengaluru and Ahmedabad</h2><p class="sub">Pilot readings are illustrative. Rates come from the cost model.</p>
   <div class="g3">${kpi(inr(riders),'riders with a live ledger record')}${kpi('Rs 28 cr','pilot budget a year: Rs 23 cr benefits, Rs 2.8 cr admin, Rs 2.3 cr reserve')}${kpi('Same day','target for alert cash; 7 days for accident cash')}</div>
   <div style="margin-top:14px"><div class="k">Riders by tier</div><div class="stack">${split.map(([n,p,c,f])=>`<div style="width:${p}%;background:${c};color:${f}">${p}%</div>`).join('')}</div>
   <div class="legend">${split.map(([n,p,c])=>`<span><i style="background:${c}"></i>${n}: ${inr(riders*p/100)}</span>`).join('')}</div></div></section>
  <section class="panel"><h2>Success metrics</h2><p class="sub">The same eight measures as the case deck, tracked from the ledger, the app and rider surveys.</p><div class="tbl"><table><thead><tr><th>Indicator</th><th>Baseline</th><th>Target</th><th>Measured by</th></tr></thead><tbody>${[
   ['UAN linked at sign-up','9.5% in Karnataka','95% in 30 days','Sign-up logs'],['Riders above Bronze','Fail the 90-day test','45%','Ledger'],['Trigger to cash','No central benefit','Same day; 7 days for accidents','DBT time stamps'],['Cover kept on switching','Policies lapse','100%','Ledger'],
   ['Deliveries lost, heat week','9.2','3.6 or fewer','Staggered roll-out'],['Paid out per Rs 100','Model: Rs 82','Rs 80 or more','CAG audit'],['Admin share','Not set','Under 12%','Fund accounts'],['Trust in the system','56% distrust','A majority trust','Rider survey']].map(r=>'<tr>'+r.map((c,i)=>i?`<td>${c}</td>`:`<td><b>${c}</b></td>`).join('')+'</tr>').join('')}</tbody></table></div></section>
  <section class="panel"><h2>What riders are raising</h2><p class="sub">Posts in the rider community, by topic. The board reviews these every week.</p>
   ${Comm.posts.length?`<div class="list">${TOPICS.map(k=>hb(L.en['tp_'+k],cnt[k]||0,mx,String(cnt[k]||0))).join('')}</div>`:'<p class="small muted">No community posts yet. Counts appear here as riders post.</p>'}</section>
  <section class="panel"><h2>Live engine log</h2><p class="sub">Signals from the demo controls in the rider app.</p><ul class="log">${S.log.slice(0,10).map(l=>`<li><span class="w">${l.who}</span><span>${esc(l.t)}</span></li>`).join('')||'<li><span class="w">Ledger</span><span>Open Demo in the rider app and send a signal.</span></li>'}</ul></section>`}
function pCost(){const l=S.riders,sc=SC[S.scen],cost=l*sc.per/100,b=cost/1.22,tb=MIX.reduce((a,x)=>a+x[1],0);
  return `<section class="panel"><h2>Cost at scale</h2><p class="sub">The cost per rider stays flat because benefits scale with earnings.</p>
   <label class="field" for="p-riders">Riders covered: <span class="num">${l} lakh${l===3?' (pilot)':''}</span></label><input type="range" id="p-riders" min="1" max="70" value="${l}">
   <div class="pills">${Object.entries(SC).map(([k,v])=>`<button data-sc="${k}" aria-pressed="${k===S.scen}">${v.n}</button>`).join('')}</div>
   <div class="bigno num">Rs ${inr(cost)} cr</div><p class="sub">a year at ${rs(sc.per)} per rider</p>
   <div class="g3">${kpi(sc.pct+'%','of rider payouts')}${kpi('Re '+sc.ord.toFixed(2),'per order')}${kpi('Rs '+inr(b)+' cr','reaches riders as benefits')}</div></section>
  <section class="panel"><h2>Where each rupee goes</h2><p class="sub">Rs crore a year for ${l} lakh riders, ${sc.n.toLowerCase()} case</p><div class="list">${
   MIX.map(([n,v])=>{const a=b*v/tb;return hb(n,v,MIX[0][1],a<1?a.toFixed(1):inr(a))}).join('')}${hb('Admin (12% of benefits)',9.2,MIX[0][1],inr(b*.12))}${hb('Reserve (10% of benefits)',7.6,MIX[0][1],inr(b*.10))}</div>
   <p class="sub" style="margin-top:10px">Bridge pay is advanced from the reserve: 3% of Silver and Gold riders blocked a year, 7 days at Rs 400, about Rs ${(l*0.378).toFixed(1)} cr a year here. It is recovered from platforms that skip the 14-day notice. The ledger and app are built once on e-Shram for about Rs 15 cr from CSR; running costs sit inside the 12% admin share.</p></section>`}
function pRoad(){return `<section class="panel"><h2>Roadmap</h2><p class="sub">Each phase moves on only when its gate is met.</p>
  ${[['Months 0 to 6','Set-up','Rules swap the day test for an earnings credit test; payout field added to the platform API; group cover tendered.','Gate: API live with the top 6 apps'],
    ['Months 6 to 18','Pilot in Bengaluru and Ahmedabad','About 3 lakh delivery riders through one heat season. Rs 28 cr a year. Help desks run by the two states.','Gate: 90% of riders on the ledger; accident cash in 7 days'],
    ['Year 2','National for delivery','All delivery platforms. 30 to 70 lakh riders, Rs 280 to 653 cr a year. States join as full or service partners.','Gate: fund solvent after actuarial review'],
    ['Year 3+','All platform work','Cabs, logistics and home services join the same ledger and app, with risk-based rates.','Gate: annual Board review']].map(([w,h,p,g])=>`<div class="phase"><div class="when">${w}</div><div><h3>${h}</h3><p>${p}</p><span class="gate">${g}</span></div></div>`).join('')}</section>
 <section class="panel"><h2>Risks and responses</h2><div class="g2">${[
  ['Cost passed to riders','Deduction from rider pay barred, as in Telangana\'s Act.'],
  ['Karnataka fee struck down in court','The set-off simply stops; the central 2.03% still funds the full package.'],
  ['Claims outrun funds','Yearly reset, a 10% reserve and the 5% legal cap.'],
  ['Sign-up gate shuts riders out','30-day grace period, help at hubs and CSCs.'],
  ['Benefits look modest','Chosen for reach; they rise as the reserve builds.'],
  ['Low app use','Hindi, read-aloud, a one-page dashboard and state help desks.']].map(([a,b])=>`<div class="kpi"><b style="font-size:17px">${a}</b><small>${b}</small></div>`).join('')}</div></section>`}
function renderPartner(){$('#ptabs').innerHTML=PT.map(([k,n])=>`<button role="tab" data-pt="${k}" aria-selected="${S.ptab===k}">${n}</button>`).join('');
  $('#pbody').innerHTML={why:pWhy,platform:pPlatform,board:pBoard,cost:pCost,road:pRoad}[S.ptab]();wirePlatform();
  const rg=$('#p-riders');if(rg)rg.oninput=e=>{S.riders=+e.target.value;const y=$('#partner').scrollTop;renderPartner();$('#partner').scrollTop=y;$('#p-riders').focus()}}
$('#ptabs').onclick=e=>{const b=e.target.closest('[data-pt]');if(b){S.ptab=b.dataset.pt;renderPartner()}};
$('#pbody').onclick=e=>{const b=e.target.closest('[data-sc]');if(b){S.scen=b.dataset.sc;renderPartner()}const q=e.target.closest('[data-plat]');if(q){PS.plat=q.dataset.plat;const y=$('#partner').scrollTop;renderPartner();$('#partner').scrollTop=y}};
$('#pclose').onclick=()=>{document.body.classList.remove('p-open');render()};

/* boot */
log('Ledger','Ramesh: Rs 26,250 across 3 apps puts him at Silver. No single app crossed the 90-day bar.');
render();renderPartner();initComm();
})();
