<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ShramPass: one ledger that protects India's delivery riders across every app and state.">
<title>ShramPass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: a consumer-grade rider app in the mould of food-delivery apps: white surfaces, black type, teal only for action and status; app bar, search, carousels, card lists, bottom tab bar, stacked detail pages. Wide screens show the app in a device frame with the partner view beside it. */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --surface2:#F6F7F8; --ink:#1B1E1F; --ink2:#3D4245; --muted:#6B7275; --line:#E6E8EA;
  --brand:#0E7380; --brand2:#2A8696; --brand-ink:#0B3C49; --brand-soft:#E6F2F3; --brand-soft2:#CDE6E9; --on-brand:#FFFFFF;
  --shade:rgba(15,23,26,.42); --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
  --hero-a:#0B3C49; --hero-b:#16808C;
  --font:"Plus Jakarta Sans","Noto Sans Devanagari","Segoe UI",Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F10; --surface:#151B1D; --surface2:#1B2326; --ink:#EEF2F3; --ink2:#C9D2D4; --muted:#94A1A5; --line:#263135;
  --brand:#4CB3BF; --brand2:#3A9FAB; --brand-ink:#A6DAE0; --brand-soft:#12292D; --brand-soft2:#1B3B40; --on-brand:#06191E;
  --shade:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4); --hero-a:#0E4652; --hero-b:#1C8C98; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F10; --surface:#151B1D; --surface2:#1B2326; --ink:#EEF2F3; --ink2:#C9D2D4; --muted:#94A1A5; --line:#263135;
  --brand:#4CB3BF; --brand2:#3A9FAB; --brand-ink:#A6DAE0; --brand-soft:#12292D; --brand-soft2:#1B3B40; --on-brand:#06191E;
  --shade:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4); --hero-a:#0E4652; --hero-b:#1C8C98; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.85em}
.muted{color:var(--muted)} .small{font-size:13px}
svg{flex:none}

.shell{height:100%;display:flex;justify-content:center;gap:24px}
#app{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
/* app bar */
.appbar{background:var(--surface);padding:10px var(--gut-r) 10px var(--gut-l);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);position:relative;z-index:2}
.loc{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0;text-align:left}
.loc svg{width:22px;height:22px;color:var(--brand)}
.loc b{display:flex;align-items:center;gap:3px;font-size:16px;font-weight:800;white-space:nowrap}
.loc b svg{width:16px;height:16px;color:var(--ink)}
.loc small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;position:relative;color:var(--ink);background:var(--surface2)}
.ib svg{width:20px;height:20px}
.ib .bdg{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}
.ib.txt{font-weight:800;font-size:14px;width:auto;padding:0 10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-weight:800;display:grid;place-items:center}
.pagebar{background:var(--surface);padding:12px var(--gut-r) 12px var(--gut-l);display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.pagebar h1{font-size:18px;font-weight:800}
.pagebar .ib{background:transparent}
#screen{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 0 22px}
.sec{padding:0 var(--gut-r) 0 var(--gut-l);margin-top:18px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.sec-h a,.link{font-size:13.5px;font-weight:700;color:var(--brand);cursor:pointer}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;display:flex;align-items:center;gap:10px}
.eyebrow::before,.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
/* search */
.search{margin:12px var(--gut-r) 0 var(--gut-l);display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;box-shadow:var(--shadow);position:relative}
.search svg{width:19px;height:19px;color:var(--brand)}
.search input{border:0;background:transparent;outline:0;flex:1;min-height:46px;font-size:15px}
.results{position:absolute;left:-1px;right:-1px;top:100%;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:5;max-height:300px;overflow:auto}
.results button{display:flex;width:100%;gap:10px;align-items:center;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results svg{width:18px;height:18px;color:var(--brand)}
/* hero card */
.hero{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.07)}
.hero .top{display:flex;justify-content:space-between;gap:10px;position:relative;z-index:1}
.hero .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;font-weight:700}
.hero .nm{font-size:21px;font-weight:800;margin-top:2px}
.hero .uan{font-family:var(--mono);font-size:13px;opacity:.9}
.medal{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border-radius:99px;padding:4px 12px 4px 5px;font-weight:800;font-size:13.5px;white-space:nowrap;height:fit-content}
.medal i{width:20px;height:20px;border-radius:50%;background:var(--medal);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;position:relative;z-index:1}
.hero .big{font-size:27px;font-weight:800;line-height:1;white-space:nowrap}
.pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.22);margin-top:10px;overflow:hidden;position:relative;z-index:1}
.pbar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .6s}
.hero .ticks{display:flex;justify-content:space-between;font-size:11.5px;opacity:.8;margin-top:5px;position:relative;z-index:1}
.hero .next{font-size:13.5px;font-weight:700;margin-top:6px;position:relative;z-index:1}
.hero .acts{display:flex;gap:8px;margin-top:12px;position:relative;z-index:1}
.hero .acts button{flex:1;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:9px;font-weight:700;font-size:13.5px;display:flex;justify-content:center;align-items:center;gap:6px}
.hero .acts svg{width:17px;height:17px}
/* carousels */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px var(--gut-r) 6px var(--gut-l);margin:0 calc(-1*var(--gut-r)) 0 calc(-1*var(--gut-l));scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start;flex:none}
.alert{width:82%;max-width:330px;border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;background:var(--brand-soft);border:1px solid var(--brand-soft2)}
.alert.dark{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
:root[data-theme="dark"] .alert.dark{color:var(--on-brand);background:var(--brand-ink)}
.alert .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--brand)}
.alert.dark .ic{background:rgba(255,255,255,.14);color:inherit}
.alert svg{width:22px;height:22px}
.alert b{display:block;font-size:14.5px}
.alert span{font-size:13px;line-height:1.35}
/* quick grid */
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;background:var(--surface);border-radius:18px;padding:14px 8px;box-shadow:var(--shadow)}
.qgrid button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink2);text-align:center;line-height:1.2}
.qgrid .qi{width:48px;height:48px;border-radius:15px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;position:relative}
.qgrid .qi svg{width:23px;height:23px}
.qgrid .qi .n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--brand-ink);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
/* cards */
.card{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.card+.card{margin-top:10px}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat3>div{background:var(--surface2);border-radius:14px;padding:10px}
.stat3 small{display:block;color:var(--muted);font-size:12px;line-height:1.25}
.stat3 b{display:block;font-size:19px;font-weight:800;margin-top:2px;white-space:nowrap}
.delta{display:inline-block;font-size:11.5px;font-weight:800;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:1px 7px;margin-top:4px}
.spark{display:block;width:100%;height:auto;margin-top:8px}
.bencard{width:150px;background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:150px}
.bencard .bi{width:38px;height:38px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.bencard .bi svg{width:20px;height:20px}
.bencard b{font-size:14px;line-height:1.25}
.bencard small{color:var(--muted);font-size:12px;line-height:1.3}
.bencard.locked{opacity:.6}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);width:fit-content}
.pill.solid{background:var(--brand);color:var(--on-brand)} .pill.off{background:var(--surface2);color:var(--muted)}
.pill svg{width:12px;height:12px}
.list{list-style:none;margin:0;padding:0}
.li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .ic{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.li .ic svg{width:20px;height:20px}
.li small{display:block;color:var(--muted);font-size:12.5px}
.li .amt{font-weight:800;color:var(--ink);white-space:nowrap}
.li .chev{width:18px;height:18px;color:var(--muted)}
.help3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.help3 button{background:var(--surface);border-radius:16px;padding:12px 6px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:700;font-size:13px;line-height:1.25;text-align:center;min-height:96px}
.help3 .qi{width:44px;height:44px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.help3 svg{width:22px;height:22px}
.todo{display:flex;flex-direction:column;gap:8px}
.todo button{display:grid;grid-template-columns:26px 1fr 16px;gap:10px;align-items:center;text-align:left;font-size:14px;padding:4px 0}
.todo .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--brand);display:grid;place-items:center;color:var(--on-brand)}
.todo .done .box{background:var(--brand)}
.todo .done span{color:var(--muted);text-decoration:line-through}
.todo svg{width:15px;height:15px}
.req{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--surface)}
.req+.req{margin-top:8px}
.req b{font-size:14.5px}
.track{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.track span{font-size:11.5px;color:var(--muted);border-top:4px solid var(--line);padding-top:4px;font-weight:700}
.track span.on{border-color:var(--brand);color:var(--brand)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
/* money */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{border-radius:10px;padding:8px 4px;font-weight:700;font-size:13.5px;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.bigmoney{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-top:10px}
.applist .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}
/* cover */
.risk{margin-top:10px}
.risk h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.risk h3 svg{width:18px;height:18px;color:var(--brand)}
.tl{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--brand-soft2);display:flex;flex-direction:column;gap:10px;font-size:14px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}
.tl b{display:block;font-size:12px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14.5px;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:800;display:grid;place-items:center;font-size:13px}
/* forms */
.field{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:700}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 12px;font-weight:500;font-size:15px;min-height:46px}
.field textarea{resize:vertical;min-height:80px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px}
.checks label{display:flex;gap:7px;align-items:center;min-height:34px}
.checks input{width:19px;height:19px;accent-color:var(--brand)}
.btn{background:var(--brand);color:var(--on-brand);border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;min-height:48px;display:inline-flex;justify-content:center;align-items:center;gap:8px}
.btn.wide{width:100%} .btn.alt{background:var(--surface);color:var(--brand);border:1.5px solid var(--brand)}
.btn svg{width:18px;height:18px}
.err{color:var(--brand);font-weight:700;font-size:13.5px;border-left:3px solid var(--brand);padding-left:8px;margin:8px 0 0}
.cert{margin-top:10px;border:1.5px dashed var(--brand);border-radius:14px;padding:12px;font-size:14px;background:var(--brand-soft)}
/* community */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-weight:700;font-size:13.5px;min-height:36px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.composer{display:flex;gap:10px;align-items:flex-start}
.composer .av{margin-top:2px}
.post{background:var(--surface);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.post+.post{margin-top:10px}
.post.ex{box-shadow:none;border:1px dashed var(--line)}
.post .who{display:flex;align-items:center;gap:10px;font-size:14px}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;flex:none}
.post .who b{display:block;font-size:14.5px}
.post .who small{color:var(--muted);font-size:12.5px}
.post p{margin:0;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.pacts{display:flex;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.pacts button{flex:1;display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);padding:6px;border-radius:10px;min-height:36px}
.pacts button svg{width:17px;height:17px}
.pacts button[aria-pressed="true"]{color:var(--brand);background:var(--brand-soft)}
.replies{border-left:3px solid var(--brand-soft2);padding-left:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.replies .r b{font-size:13px;color:var(--brand)}
.rinput{display:flex;gap:6px}
.rinput input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface2);font-size:14.5px;min-width:0}
.minipost{width:250px;background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.minipost b{font-size:13px}
.issues .row{font-size:13.5px;margin-top:6px}
/* profile */
.prof{display:flex;gap:14px;align-items:center}
.prof .avatar{width:58px;height:58px;font-size:22px}
.prof h2{font-size:20px;font-weight:800}
.menu .li{grid-template-columns:36px 1fr 18px;padding:12px 0}
.menu .li .ic{width:36px;height:36px;border-radius:11px}
/* sheet */
.sheet-wrap{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px var(--gut-r) calc(18px + env(safe-area-inset-bottom,0px)) var(--gut-l);display:flex;flex-direction:column;gap:12px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 2px}
.sheet h2{font-size:20px;font-weight:800}
.bigqr{background:#fff;border-radius:16px;padding:14px;width:min(240px,100%);margin:0 auto;box-shadow:var(--shadow)}
.bigqr svg{display:block;width:100%;height:auto}
.demo-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.demo-acts button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px;text-align:left;display:flex;gap:9px;align-items:center;font-weight:700;font-size:13.5px;min-height:50px}
.demo-acts svg{width:21px;height:21px;color:var(--brand)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:grid;grid-template-columns:74px 1fr;gap:8px;font-size:13px;padding:7px 10px;border-radius:10px;background:var(--surface2)}
.log .w{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);padding-top:2px}
/* nav + fab */
nav.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:0 var(--gut-r) 0 var(--gut-l)}
nav.tabbar button{padding:8px 0 9px;font-size:11.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;position:relative}
nav.tabbar svg{width:23px;height:23px}
nav.tabbar button[aria-current="page"]{color:var(--brand)}
nav.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.dot{position:absolute;top:6px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--brand-ink);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.fab{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:72px;background:var(--ink);color:var(--surface);border-radius:99px;padding:9px 14px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:3}
.fab svg{width:16px;height:16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);opacity:0;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14.5px;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);z-index:40;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:22px 0 4px}
/* partner view */
#partner{display:none;flex:1;max-width:820px;height:100%;overflow-y:auto;padding:16px var(--gut-r) 28px var(--gut-l);background:var(--bg)}
body.p-open #partner{display:block}
body.p-open #app{display:none}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.phead h1{font-size:24px;font-weight:800;margin-right:auto}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.ptabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px}
.ptabs button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.panel{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel>h2{font-size:19px;font-weight:800}
.panel>p.sub,.sub{margin:4px 0 12px;color:var(--muted);font-size:14.5px;max-width:70ch}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface2);border-radius:14px;padding:10px 12px;min-width:0}
.kpi b{display:block;font-size:22px;font-weight:800;color:var(--brand);line-height:1.2}
.kpi small{color:var(--muted);font-size:13px;display:block;line-height:1.35}
.chain{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.chain div{border-radius:12px;padding:9px 10px;font-size:13px;line-height:1.35;background:var(--brand-soft)}
.chain div b{display:block;color:var(--brand-ink);font-size:13.5px;margin-bottom:3px}
.chain div:nth-child(n+4){background:var(--brand);color:var(--on-brand)}
.chain div:nth-child(n+4) b{color:var(--on-brand)}
.stack{height:28px;display:flex;border-radius:8px;overflow:hidden;margin:6px 0}
.stack div{display:grid;place-items:center;font-size:12.5px;font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.phase{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.phase:last-child{border-bottom:0}
.phase .when{font-weight:800;color:var(--brand);font-size:15px}
.phase h3{font-size:16px;font-weight:800;margin-bottom:4px}
.phase p{margin:0;font-size:14px}
.gate{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:3px 8px}
input[type=range]{width:100%;accent-color:var(--brand);min-height:32px}
.bigno{font-size:40px;font-weight:800;line-height:1}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13.5px}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.hb{display:grid;grid-template-columns:minmax(110px,180px) 1fr 70px;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
@media (min-width:980px){
  body{padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));background:var(--surface2)}
  #app{max-width:400px;border:10px solid #111;border-radius:40px;height:min(880px,100%);flex:none;box-shadow:0 20px 40px rgba(0,0,0,.18)}
  #partner{display:block;padding:0 4px 28px;background:transparent}
  body.p-open #app{display:flex}
  #pclose{display:none}
  .sheet-wrap{position:absolute;border-radius:30px}
}
@media (max-width:620px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.chain{grid-template-columns:minmax(0,1fr)}}
@media (max-width:360px){.qgrid{grid-template-columns:repeat(4,1fr)}.stat3 b{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.k{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#app.paged .fab{bottom:16px}
button.li,button.alert,button.bencard,button.minipost{text-align:left;color:inherit;font:inherit}
.alert{cursor:pointer}
details.card summary{min-height:28px}
.minipost .row{gap:8px}
.minipost span:last-child{color:var(--ink2);line-height:1.4}
</style>

async function initComm(){localLoad();Comm.uid='me';

    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db)return;const id=user?await user.id():null;if(!id)return;

    Comm.db=db;Comm.uid=id;Comm.mode='live';Comm.canWrite=cw!==false;Comm.posts=[];Comm.replies=[];Comm.helpful=[];

function logWeek(quiet){const r=R(),b=tierI(r);S.week++;S.date=new Date(S.date.getTime()+7*864e5);
  const w={w:S.week,tg:between(450,820),bn:rnd()<.8?between(300,560):0,pp:rnd()<.5?between(120,320):0};

  if(r.save){const s=Math.round(wk*r.save/100);r.saved+=s;if(tierI(r)===2&&r.matched<1200){const m=Math.min(s,1200-r.matched);r.matched+=m}}
  r.reqs.forEach(q=>{if(q.st<3)q.st++});r.alert=null;
  if(!quiet){log('Platform',`3 apps uploaded week ${S.week}: ${rs(wk)} for UAN ...${r.uan.slice(-4)}; platforms pay ${rs(wk*.021)}`);log('Ledger',`12-month credits ${rs(total(r))}: ${tierOf(r).id}`)}

   ['UAN linked at sign-up','9.5% in Karnataka','95% in 30 days','Sign-up logs'],['Riders above Bronze','Fail the 90-day test','45%','Ledger'],['Trigger to cash','No central benefit','Same day; 7 days for accidents','DBT time stamps'],['Cover kept on switching','Policies lapse','100%','Ledger'],
   ['Deliveries lost, heat week','9.2','3.6 or fewer','Staggered roll-out'],['Paid out per Rs 100','Model: Rs 82','Rs 80 or more','CAG audit'],['Admin share','Not set','Under 12%','Fund accounts'],['Trust in the system','56% distrust','A majority trust','Rider survey']].map(r=>'<tr>'+r.map((c,i)=>i?`<td>${c}</td>`:`<td><b>${c}</b></td>`).join('')+'</tr>').join('')}</tbody></table></div></section>
  <section class="panel"><h2>What riders are raising</h2><p class="sub">Posts in the rider community, by topic. The board reviews these every week.</p>
   ${Comm.posts.length?`<div class="list">${TOPICS.map(k=>hb(L.en['tp_'+k],cnt[k]||0,mx,String(cnt[k]||0))).join('')}</div>`:'<p class="small muted">No community posts yet. Counts appear here as riders post.</p>'}</section>
  <section class="panel"><h2>Live engine log</h2><p class="sub">Signals from the demo controls in the rider app.</p><ul class="log">${S.log.slice(0,10).map(l=>`<li><span class="w">${l.who}</span><span>${esc(l.t)}</span></li>`).join('')||'<li><span class="w">Ledger</span><span>Open Demo in the rider app and send a signal.</span></li>'}</ul></section>`}
function pCost(){const l=S.riders,sc=SC[S.scen],cost=l*sc.per/100,b=cost/1.22,tb=MIX.reduce((a,x)=>a+x[1],0);
  return `<section class="panel"><h2>Cost at scale</h2><p class="sub">The cost per rider stays flat because benefits scale with earnings.</p>
   <label class="field" for="p-riders">Riders covered: <span class="num">${l} lakh${l===3?' (pilot)':''}</span></label><input type="range" id="p-riders" min="1" max="70" value="${l}">
   <div class="pills">${Object.entries(SC).map(([k,v])=>`<button data-sc="${k}" aria-pressed="${k===S.scen}">${v.n}</button>`).join('')}</div>
   <div class="bigno num">Rs ${inr(cost)} cr</div><p class="sub">a year at ${rs(sc.per)} per rider</p>
   <div class="g3">${kpi(sc.pct+'%','of rider payouts')}${kpi('Re '+sc.ord.toFixed(2),'per order')}${kpi('Rs '+inr(b)+' cr','reaches riders as benefits')}</div></section>
  <section class="panel"><h2>Where each rupee goes</h2><p class="sub">Rs crore a year for ${l} lakh riders, ${sc.n.toLowerCase()} case</p><div class="list">${
   MIX.map(([n,v])=>{const a=b*v/tb;return hb(n,v,MIX[0][1],a<1?a.toFixed(1):inr(a))}).join('')}${hb('Admin (12% of benefits)',9.2,MIX[0][1],inr(b*.12))}${hb('Reserve (10% of benefits)',7.6,MIX[0][1],inr(b*.10))}</div>
   <p class="sub" style="margin-top:10px">Bridge pay is advanced from the reserve: 3% of Silver and Gold riders blocked a year, 7 days at Rs 400, about Rs ${(l*0.378).toFixed(1)} cr a year here. It is recovered from platforms that skip the 14-day notice. The ledger and app are built once on e-Shram for about Rs 15 cr from CSR; running costs sit inside the 12% admin share.</p></section>`}
function pRoad(){return `<section class="panel"><h2>Roadmap</h2><p class="sub">Each phase moves on only when its gate is met.</p>
  ${[['Months 0 to 6','Set-up','Rules swap the day test for an earnings credit test; payout field added to the platform API; group cover tendered.','Gate: API live with the top 6 apps'],
    ['Months 6 to 18','Pilot in Bengaluru and Ahmedabad','About 3 lakh delivery riders through one heat season. Rs 29 cr a year. Help desks run by the two states.','Gate: 90% of riders on the ledger; accident cash in 7 days'],
    ['Year 2','National for delivery','All delivery platforms. 30 to 70 lakh riders, Rs 290 to 676 cr a year. States join as full or service partners.','Gate: fund solvent after actuarial review'],
    ['Year 3+','All platform work','Cabs, logistics and home services join the same ledger and app, with risk-based rates.','Gate: annual Board review']].map(([w,h,p,g])=>`<div class="phase"><div class="when">${w}</div><div><h3>${h}</h3><p>${p}</p><span class="gate">${g}</span></div></div>`).join('')}</section>
 <section class="panel"><h2>Risks and responses</h2><div class="g2">${[
  ['Cost passed to riders','Deduction from rider pay barred, as in Telangana\'s Act.'],
  ['Karnataka fee struck down in court','The set-off simply stops; the central 2.10% still funds the full package.'],
  ['Claims outrun funds','Yearly reset, a 10% reserve and the 5% legal cap.'],
  ['Sign-up gate shuts riders out','30-day grace period, help at hubs and CSCs.'],
  ['Benefits look modest','Chosen for reach; they rise as the reserve builds.'],
  ['Low app use','Hindi, read-aloud, a one-page dashboard and state help desks.']].map(([a,b])=>`<div class="kpi"><b style="font-size:17px">${a}</b><small>${b}</small></div>`).join('')}</div></section>`}
function renderPartner(){$('#ptabs').innerHTML=PT.map(([k,n])=>`<button role="tab" data-pt="${k}" aria-selected="${S.ptab===k}">${n}</button>`).join('');
  $('#pbody').innerHTML={why:pWhy,platform:pPlatform,board:pBoard,cost:pCost,road:pRoad}[S.ptab]();wirePlatform();
  const rg=$('#p-riders');if(rg)rg.oninput=e=>{S.riders=+e.target.value;const y=$('#partner').scrollTop;renderPartner();$('#partner').scrollTop=y;$('#p-riders').focus()}}
$('#ptabs').onclick=e=>{const b=e.target.closest('[data-pt]');if(b){S.ptab=b.dataset.pt;renderPartner()}};
$('#pbody').onclick=e=>{const b=e.target.closest('[data-sc]');if(b){S.scen=b.dataset.sc;renderPartner()}const q=e.target.closest('[data-plat]');if(q){PS.plat=q.dataset.plat;const y=$('#partner').scrollTop;renderPartner();$('#partner').scrollTop=y}};
$('#pclose').onclick=()=>{document.body.classList.remove('p-open');render()};
/* boot */
log('Ledger','Ramesh: Rs 26,250 across 3 apps puts him at Silver. No single app crossed the 90-day bar.');
render();renderPartner();initComm();
})();
</script>
